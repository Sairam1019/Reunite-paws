<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Reunion</title>
    <link rel="stylesheet" href="/public/css/style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <header>
        <nav>
            <ul>
                <li><a href="/" onclick="navigateTo('home')">Home</a></li>
                <li><a href="/about" onclick="navigateTo('about')">About Us</a></li>
                <li><a href="/contact" onclick="navigateTo('contact')">Contact Us</a></li>
                <li><a href="/food-tips" onclick="navigateTo('food-tips')">Food Tips</a></li>

            </ul>
        </nav>

    <div class="intro-frame">
        <div class="main-section">

            <div class="buttons">
                <button class="action-btn" onclick="location.href='/form/lost'">Report Lost Pet</button>
                <button class="action-btn" onclick="location.href='/form/found'">Report Found Pet</button>
                <button class="action-btn" onclick="location.href='/form/adopt'">Request Adoption</button>
            </div>
        </div>
    </div>

    <script src="/public/js/script.js"></script>
