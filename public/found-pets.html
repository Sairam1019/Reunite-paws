<!-- public/found-pets.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Found Pets - Pet Reunion</title>
    <link rel="stylesheet" href="/public/css/style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <header>
        <nav>
            <ul>
                <li><a href="/" onclick="navigateTo('home')">Home</a></li>
                <li><a href="/about" onclick="navigateTo('about')">About Us</a></li>
                <li><a href="/contact" onclick="navigateTo('contact')">Contact Us</a></li>
                <li><a href="/food-tips" onclick="navigateTo('food-tips')">Food Tips</a></li>
                <li><a href="/training-tips" onclick="navigateTo('training-tips')">Training Tips</a></li>
                <li><a href="/lost-pets" onclick="navigateTo('lost-pets')">Lost Pets</a></li>
                <li><a href="/found-pets" onclick="navigateTo('found-pets')">Found Pets</a></li>
                <li><a href="/adoptable-pets" onclick="navigateTo('adoptable-pets')">Adopters</a></li>
            </ul>
        </nav>
    </header>

    <!-- Found Pets Listing -->
    <div class="container">
        <h1>Found Pets</h1>
        <div class="pets-container">
            <!-- Found Pets will be displayed here -->
            <script>
                fetch('/api/found-pets')
                    .then(response => response.json())
                    .then(data => {
                        const container = document.querySelector('.pets-container');
                        if (data.length === 0) {
                            container.innerHTML = '<p>No found pets reported at the moment.</p>';
                            return;
                        }
                        data.forEach(pet => {
                            container.innerHTML += `
                                <div class="pet-card">
                                    ${pet.photo ? `<img src="/${pet.photo}" alt="${pet.name}" />` : ''}
                                    <h3>${pet.name}</h3>
                                    <p>${pet.description}</p>
                                    <p><strong>Location Found:</strong> ${pet.location}</p>
                                    <p><strong>email:</strong> ${pet.email}</p>
                                    <p><strong>contact no:</strong> ${pet.contact}
                                </div>
                            `;
                        });
                    })
                    .catch(error => {
                        console.error('Error fetching found pets:', error);
                        document.querySelector('.pets-container').innerHTML = '<p>Error loading found pets.</p>';
                    });
            </script>
        </div>
    </div>
</body>
</html>
